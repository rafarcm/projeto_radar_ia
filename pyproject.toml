[project]
name = "radar-ia"
version = "0.1.0"
description = "Coleta notícias de IA de fontes cadastradas, traduz e resume em pt-BR com LangChain e gera um PDF."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langchain-anthropic==1.7.6",
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "ruamel.yaml==0.19.1",
    "typer==0.27.3",
    "python-dotenv==1.2.4",
    "langdetect==1.0.9",
    "reportlab==5.1.0",
    "trafilatura==2.3.1",
    "rapidfuzz==3.14.6",
    "tenacity==9.2.1",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "fastembed==0.9.0",
    "numpy==2.5.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
radar = "radar_ia.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar_ia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
