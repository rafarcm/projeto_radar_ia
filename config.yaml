# config.yaml - comportamento do radar-ia (chaves e senhas ficam no .env)

coleta:
  horas: 24                  # janela de tempo padrão (--horas sobrescreve)
  max_itens: 40              # limite de itens enviados ao LLM (--max-itens sobrescreve)
  max_itens_por_fonte: 15    # evita que uma fonte volumosa (ex.: arXiv) domine
  timeout_segundos: 20
  tentativas: 3
  user_agent: "radar-ia/0.1 (+https://github.com/seu-usuario/radar-ia)"
  # Corte do texto do artigo enviado ao LLM (--texto-completo ou feed insuficiente).
  # 20000 caracteres (~5 mil tokens) cobrem quase todos os artigos; o excedente é descartado.
  max_caracteres_artigo: 20000

deduplicacao:
  limiar_titulo: 90          # 0-100; similaridade de título acima disso = duplicado
  # Duplicados por significado (mesma notícia com títulos diferentes), com um
  # modelo de embeddings que roda localmente, sem custo. Na primeira execução o
  # modelo (~220 MB) é baixado do Hugging Face, sem precisar de conta.
  semantica: true
  limiar_semantico: 0.70     # 0-1; maior = mais rigoroso. Calibrado em notícias reais (só compara fontes diferentes)
  modelo_embeddings: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  pasta_modelos: ~/.cache/radar-ia/modelos

processamento:
  concorrencia: 4            # chamadas simultâneas ao LLM
  tentativas: 3
  max_tentativas_traducao: 2 # refazer quando o texto gerado não sai em português
  num_destaques: 5           # 3 a 5
  # Se o feed traz só o título ou um resumo curto, baixa o artigo (respeitando
  # robots.txt) e refaz o resumo com o texto completo. Custa uma chamada a mais ao LLM.
  buscar_artigo_se_insuficiente: true

saida:
  pasta_relatorios: relatorios
  banco_sqlite: dados/radar.sqlite3
  banco_checkpoints: dados/checkpoints.sqlite3  # permite "radar gerar --retomar"

entrega:
  email:
    ativo: true
    # Destinatários ficam no .env (EMAIL_DESTINATARIOS), fora do Git.
    assunto: "Radar IA - {data}"
  telegram:
    ativo: false
